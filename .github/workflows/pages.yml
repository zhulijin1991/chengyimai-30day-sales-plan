name: Deploy sales plan to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html launch.html .nojekyll _site/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          page = Path('_site/index.html').read_bytes()
          if not page:
              raise SystemExit('index.html is empty')
          revision = {
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'index_sha256': hashlib.sha256(page).hexdigest(),
              'launch_sha256': hashlib.sha256(Path('_site/launch.html').read_bytes()).hexdigest(),
          }
          Path('_site/deployment.json').write_text(json.dumps(revision, indent=2) + '\n')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
          include-hidden-files: true

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
