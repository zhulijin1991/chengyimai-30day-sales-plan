    <text x="300" y="995" fill="#000000" font-size="13" font-weight="400" text-anchor="middle">更新Task 1进展</text>
    <rect x="336" y="1054" width="118" height="23" rx="0" fill="#fff" stroke="none" />
    <text x="395" y="1070" fill="#000000" font-size="13" font-weight="400" text-anchor="middle">Task 1 的进展</text>
    <rect x="746" y="1054" width="118" height="23" rx="0" fill="#fff" stroke="none" />
    <text x="805" y="1070" fill="#000000" font-size="13" font-weight="400" text-anchor="middle">Task 2 的进展</text>
    <rect x="477.5" y="1330" width="245.0" height="23" rx="0" fill="#fff" stroke="none" />
    <text x="600" y="1346" fill="#000000" font-size="13" font-weight="400" text-anchor="middle">本轮1／3、2／3的阶段检查</text>
    <rect x="531.5" y="1690" width="137" height="23" rx="0" fill="#fff" stroke="none" />
    <text x="600" y="1706" fill="#000000" font-size="13" font-weight="400" text-anchor="middle">提出阶段性复盘建议</text>
    <rect x="680.0" y="1914" width="124.0" height="23" rx="0" fill="#fff" stroke="none" />
    <text x="742" y="1930" fill="#000000" font-size="13" font-weight="400" text-anchor="middle">业主同意后发起</text>
    <rect x="623.5" y="2172" width="137" height="23" rx="0" fill="#fff" stroke="none" />
    <text x="692" y="2188" fill="#000000" font-size="13" font-weight="400" text-anchor="middle">下发一条维护人任务</text>
    <rect x="139" y="1309" width="145" height="23" rx="0" fill="#fff" stroke="none" />
    <text x="280" y="1325" fill="#000000" font-size="13" font-weight="400" text-anchor="end">邀约结果回传安住</text>
    <rect x="332" y="1944" width="118" height="24" rx="6" fill="#f6e7c8" stroke="none" />
    <text x="391" y="1960" fill="#805e24" font-size="14" font-weight="600" text-anchor="middle">辰宇提供</text>
    <rect x="646" y="468" width="118" height="24" rx="6" fill="#f6e7c8" stroke="none" />
    <text x="705" y="484" fill="#805e24" font-size="14" font-weight="600" text-anchor="middle">付颖提供</text>
  </g>
</svg>
